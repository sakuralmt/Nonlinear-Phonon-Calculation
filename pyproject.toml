[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonlinear-phonon-calculation"
version = "1.0.1"
description = "Structure-aware hexagonal 2D phonon and MLFF coupling screening."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "ase>=3.22",
  "matplotlib>=3.7",
  "phonopy==2.38.0",
  "spglib>=2.0,<3",
]

license = { text = "MIT" }
authors = [
  { name = "qiyan Codex packaging workflow" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
prophet = [
  "prophet-mlip @ git+https://github.com/kairosmaterial/prophet.git@c4fda8251d8a7c90c7cb7842aea4d2f57e5fc3bd",
]

[project.scripts]
npc = "nonlinear_phonon_calculation.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "nonlinear_phonon_calculation*",
  "mlff_modepair_workflow*",
]
namespaces = true
